# .github/workflows/fetch_guest_token.yml
name: Fetch Hotstar Guest Token
on:
  schedule:
    - cron: '0 */20 * * *'  # har 20 ghante
  workflow_dispatch:  # manual trigger bhi

jobs:
  fetch-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
          
      - name: Fetch Guest Token
        run: node fetch_token.js
        
      - name: Commit token
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add guest_token.txt
          git diff --staged --quiet || git commit -m "Update guest token"
          git push
